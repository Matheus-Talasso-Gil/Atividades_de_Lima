<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Interno</title>
    <style>
        body {
            background-color: lightgray;
            color: black;
            font-family: Arial;
            margin: 24px;
            line-height: 1.5;
        }

        h1 {
            color: blue;
        }

        hr {
            border: 0;
            border-top: 1px solid gray;
        }
    </style>
</head>
<body>
    <h1>CSS Interno</h1>
    <hr>
    <h2>Parte B</h2>
    <hr>
    <p>Os estilos ficam na tag style dentro do HTML.</p>
    <hr>
    <p>Este é um exemplo simples de CSS interno.</p>
    <hr>
</body>
</html>
